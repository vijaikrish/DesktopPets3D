# Tests and builds the stand-alone app for Windows (x64) and macOS (Apple Silicon) on GitHub's machines.
# - every push to main: tests + build; the zips are under the run's "Artifacts" (no release)
# - every pushed version tag v0.4.0 / V0.4.0: the same, and the zips are attached to that GitHub Release
# - on demand: Actions tab > build > Run workflow
# A failing test is shown by name with its error on the run page (annotations), no need to open the raw log.
name: build

on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-x64
          - os: macos-14
            asset: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: '1'
        run: python tools/ci_tests.py

      - name: Plugin check
        run: python -m app.plugin_check

      - name: Build
        run: python -m PyInstaller --noconfirm --clean packaging/DesktopPets3D.spec

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/DesktopPets3D -DestinationPath DesktopPets3D-${{ matrix.asset }}.zip

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/DesktopPets3D.app DesktopPets3D-${{ matrix.asset }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopPets3D-${{ matrix.asset }}
          path: DesktopPets3D-${{ matrix.asset }}.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DesktopPets3D-${{ matrix.asset }}.zip
